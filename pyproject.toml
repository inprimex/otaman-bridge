[project]
name = "otaman-bridge"
version = "0.2.0"
description = "Otaman server daemon: HTTP API, MCP server, NATS gateway, bus + session + transport coordinators"
requires-python = ">=3.10"
authors = [{ name = "Otaman platform" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "otaman-core",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21,<23"]
oidc = ["pyjwt[crypto]>=2.8"]
# ce-refresh-token 1.2: the runner-free CE web-auth surface mounts
# otaman-core's shared AuthService (pyjwt[crypto] + bcrypt).
web-auth = ["otaman-core[web-auth]"]
test = [
    "pytest>=7",
    "python-telegram-bot>=21,<23",
    "pyjwt[crypto]>=2.8",
    "otaman-core[web-auth]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Phase 2 of CE/EE split: both packages ship from the same repo while
# everything is private + proprietary. When CE goes public AGPL,
# otaman_bridge_ee gets extracted via strategy/ce-ee-prep/sync-ce.sh.
packages = ["src/otaman_bridge", "src/otaman_bridge_ee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../otaman-core/src", "../otaman-adapters/src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These tests set up invocation constants / import-path context before
# importing the package under test; the import order is intentional.
"tests/test_bridge_approval.py" = ["E402"]
"tests/test_stop_notify.py" = ["E402"]

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
]
