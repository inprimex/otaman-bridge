[project]
name = "otaman-bridge"
version = "0.1.0"
description = "Otaman server daemon: HTTP API, MCP server, NATS gateway, bus + session + transport coordinators"
requires-python = ">=3.10"
authors = [{ name = "Otaman platform" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "otaman-core",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21,<23"]
oidc = ["pyjwt[crypto]>=2.8"]
test = ["pytest>=7", "python-telegram-bot>=21,<23", "pyjwt[crypto]>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Phase 2 of CE/EE split: both packages ship from the same repo while
# everything is private + proprietary. When CE goes public AGPL,
# otaman_bridge_ee gets extracted via strategy/ce-ee-prep/sync-ce.sh.
packages = ["src/otaman_bridge", "src/otaman_bridge_ee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../otaman-core/src"]

[dependency-groups]
dev = [
    "watchdog>=6.0.0",
]
