[project]
name = "otaman-bridge"
version = "0.1.0"
description = "Otaman server daemon: HTTP API, MCP server, NATS gateway, bus + session + transport coordinators"
requires-python = ">=3.10"
authors = [{ name = "Otaman platform" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "otaman-core",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21,<23"]
test = ["pytest>=7", "python-telegram-bot>=21,<23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otaman_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../otaman-core/src"]
