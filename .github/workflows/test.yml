name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Force Node 24 runtime now (deprecated Node 20 removed Sep 16 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout otaman-bridge
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # ruff pinned exactly per F182 doctrine (ce-lint-standard);
      # version bumps are ordinary PRs.
      - name: ruff check
        run: uv tool run ruff@0.16.3 check .

      - name: ruff format check
        run: uv tool run ruff@0.16.3 format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout otaman-bridge
        uses: actions/checkout@v7
        with:
          path: workspace/otaman-bridge

      - name: Checkout otaman-core (sibling path-dep)
        uses: actions/checkout@v7
        with:
          repository: inprimex/otaman-core
          path: workspace/otaman-core

      - name: Generate workspace pyproject.toml
        shell: bash
        working-directory: workspace
        run: |
          cat > pyproject.toml <<'EOF'
          [project]
          name = "otaman-ci-workspace"
          version = "0.0.0"
          description = "Ephemeral workspace pyproject used by CI to wire up sibling path-deps"
          requires-python = ">=3.10"

          [tool.uv.workspace]
          members = ["otaman-core","otaman-bridge"]

          [tool.uv.sources]
          otaman-core = { workspace = true }
          otaman-bridge = { workspace = true }
          EOF
          echo "Workspace pyproject written:"
          cat pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "workspace/otaman-bridge/pyproject.toml"

      - name: Install dependencies
        working-directory: workspace/otaman-bridge
        run: uv sync --extra test --no-dev

      - name: Audit maestro references
        if: runner.os != 'Windows'
        working-directory: workspace/otaman-bridge
        run: bash ../otaman-core/scripts/audit-maestro-refs.sh src/

      - name: Run tests
        working-directory: workspace/otaman-bridge
        run: uv run pytest tests/ -v

  # release-notes-sibling-coverage 2.3: block a shipped-code PR that carries no
  # changelog.d/ fragment (nor the `changelog: exempt` PR-body marker). The gate
  # is otaman-core's shared evaluator invoked as one identical line every sibling
  # wires (core #68/#69) — no otaman CLI (private, and cli→bridge forbids the
  # import), no repo-local script. The module is stdlib-only, so otaman-core on
  # PYTHONPATH is all it needs. PR-only.
  changelog-fragment:
    name: changelog-fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout otaman-bridge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so the base...HEAD merge-base diff resolves
          path: otaman-bridge

      - name: Checkout otaman-core (evaluator home)
        uses: actions/checkout@v7
        with:
          repository: inprimex/otaman-core
          path: otaman-core

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Fetch base ref
        working-directory: otaman-bridge
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Write PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/pr_body.txt"

      - name: Changelog fragment gate
        working-directory: otaman-bridge
        env:
          PYTHONPATH: ${{ github.workspace }}/otaman-core/src
        run: >
          python -m otaman_core.changelog_fragment
          --check
          --base "origin/${{ github.base_ref }}"
          --pr "${{ github.event.pull_request.number }}"
          --pr-body-file "${RUNNER_TEMP}/pr_body.txt"

  # Branch-protection anchor (fleet-uniform, spec-agent 20260818T202444):
  # `ci-ok` needs every merge-blocking job; protection requires exactly this
  # one check, immune to job renames and matrix churn. Plain variant (no
  # `if: always()`): a skipped ci-ok counts as not-passed, which blocks
  # correctly.
  ci-ok:
    name: ci-ok
    needs: [lint, test, changelog-fragment]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
